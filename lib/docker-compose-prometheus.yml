services:
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    hostname: prometheus
    container_name: prometheus
    restart: always
    volumes:
      - ../etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - volume:/prometheus
    ports:
      - ${PROMETHEUS_PUBLIC_PORT}:9090

volumes:
  volume:

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}