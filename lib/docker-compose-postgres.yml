services:
  postgres:
    image: docker.io/postgres:17.2
    hostname: postgres
    container_name: postgres
    restart: always
    volumes:
      - volume:/var/lib/postgresql/data
    environment:
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${DEFAULT_USER}
      POSTGRES_USER: ${DEFAULT_USER}
      POSTGRES_PASSWORD: ${DEFAULT_PASSWORD}
    ports:
      - ${POSTGRES_PUBLIC_PORT}:${POSTGRES_PORT}
    healthcheck:
      test: /usr/bin/pg_isready --dbname=${DEFAULT_USER} --username=${DEFAULT_USER} || exit 1
      interval: 5s
      timeout: 15s
      retries: 3

volumes:
  volume:

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}