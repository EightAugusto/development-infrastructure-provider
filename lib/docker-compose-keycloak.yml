services:
  # Keycloak Postgres
  keycloak_postgres:
    image: postgres:16.3
    hostname: keycloak_postgres
    container_name: keycloak_postgres
    restart: always
    volumes:
      - volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${DEFAULT_USER}
      POSTGRES_PASSWORD: ${DEFAULT_PASSWORD}
  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    hostname: keycloak
    container_name: keycloak
    restart: always
    command: start-dev --http-port=${KEYCLOAK_PORT}
    environment:
      # Keycloak configuration
      KEYCLOAK_ADMIN: ${DEFAULT_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${DEFAULT_PASSWORD}
      # Keycloak database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/keycloak
      KC_DB_USERNAME: ${DEFAULT_USER}
      KC_DB_PASSWORD: ${DEFAULT_PASSWORD}
    ports:
      - ${KEYCLOAK_PUBLIC_PORT}:${KEYCLOAK_PORT}
    depends_on:
      - keycloak_postgres

volumes:
  volume:

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}