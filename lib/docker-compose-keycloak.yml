services:
  # Keycloak Postgres
  keycloak_postgres:
    image: docker.io/postgres:17.2
    hostname: keycloak_postgres
    container_name: keycloak_postgres
    restart: always
    volumes:
      - volume:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${DEFAULT_USER}
      POSTGRES_PASSWORD: ${DEFAULT_PASSWORD}
    healthcheck:
      test: /usr/bin/pg_isready --dbname=${KEYCLOAK_DB} --username=${DEFAULT_USER} || exit 1
      interval: 5s
      timeout: 15s
      retries: 3
  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    hostname: keycloak
    container_name: keycloak
    restart: always
    command: start-dev --http-port=${KEYCLOAK_PORT}
    environment:
      # Keycloak configuration
      KEYCLOAK_ADMIN: ${DEFAULT_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${DEFAULT_PASSWORD}
      # Keycloak database configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${DEFAULT_USER}
      KC_DB_PASSWORD: ${DEFAULT_PASSWORD}
    ports:
      - ${KEYCLOAK_PUBLIC_PORT}:${KEYCLOAK_PORT}
    depends_on:
      keycloak_postgres:
        condition: service_healthy

volumes:
  volume:

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}