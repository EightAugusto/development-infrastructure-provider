services:
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    hostname: jaeger
    container_name: jaeger
    restart: always
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=${JAEGER_COLLECTOR_ZIPKIN_HOST_PORT}
    ports:
      - ${JAEGER_PUBLIC_PORT}:16686
      - ${JAEGER_COLLECTOR_ZIPKIN_HOST_PORT}:${JAEGER_COLLECTOR_ZIPKIN_HOST_PORT}

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}