services:
  nexus:
    image: sonatype/nexus3:3.71.0
    hostname: nexus
    container_name: nexus
    restart: always
    volumes:
      - volume:/nexus-data
    ports:
      - ${NEXUS_PUBLIC_PORT}:8081
      - ${NEXUS_DOCKER_PORT}:${NEXUS_DOCKER_PORT}
    healthcheck:
      test: curl --fail http://localhost:8081|| exit 1
      interval: 5s
      retries: 3
      timeout: 60s

volumes:
  volume:

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK}